<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kdb-fts review</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  #meta { color: #666; font-size: .9rem; margin: .25rem 0 1rem; }
  #body { white-space: pre-wrap; background: #fafafa; border: 1px solid #ddd; padding: 1rem; max-height: 55vh; overflow-y: auto; }
  #bar { margin: 1rem 0; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  button { font-size: 1rem; padding: .5rem 1rem; cursor: pointer; }
  button.strong { background: #d7f0d7; } button.noise { background: #f0d7d7; }
  button.selected { outline: 3px solid #222; outline-offset: 1px; filter: brightness(.88); }
  button:disabled { opacity: .4; cursor: default; }
  #reason { width: 100%; min-height: 3rem; margin-top: .5rem; display: none; }
  #progress { color: #666; }
  #saved { color: #2a7; margin-left: .5rem; }
  kbd { background: #eee; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<h2 id="title">loading…</h2>
<div id="meta"></div>
<div id="bar">
  <button id="prev" title="previous article">&#8592; Prev</button>
  <button data-action="strong" class="strong">strong <kbd>1</kbd></button>
  <button data-action="interesting">interesting <kbd>2</kbd></button>
  <button data-action="weak">weak <kbd>3</kbd></button>
  <button data-action="noise" class="noise">noise <kbd>4</kbd></button>
  <button id="next" title="next article">Next &#8594;</button>
  <button id="next-unlabeled" title="jump to the next article without a label (wraps around)">Next unlabeled <kbd>u</kbd></button>
  <span id="progress"></span><span id="unlabeled"></span><span id="saved"></span>
</div>
<textarea id="reason" placeholder="why? (optional — Enter saves the label, Shift+Enter for newline, Esc cancels)"></textarea>
<div id="body"></div>
<script>
let batch = null, idx = 0, pendingAction = null;
const selections = {};  // article_id → action (server labels + this session)

async function init() {
  batch = await (await fetch('/batch')).json();
  Object.assign(selections, await (await fetch('/labels')).json());
  document.title = 'kdb-fts review — ' + batch.batch_id;
  show(0);
}

function show(i) {
  idx = i;
  const it = batch.items[i];
  document.getElementById('title').textContent = it.title || '(untitled)';
  document.getElementById('meta').textContent =
    (it.author || '?') + ' · ' + (it.published_date || '?') +
    ' · topic guess: ' + it.topic + ' · signal ' + it.signal.toFixed(2);
  document.getElementById('body').textContent = it.body;
  document.getElementById('reason').style.display = 'none';
  document.getElementById('reason').value = '';
  const sel = selections[it.article_id];
  document.querySelectorAll('button[data-action]').forEach(b =>
    b.classList.toggle('selected', b.dataset.action === sel));
  document.getElementById('saved').textContent = sel ? '✓ ' + sel : '';
  document.getElementById('prev').disabled = (i === 0);
  document.getElementById('next').disabled = (i === batch.items.length - 1);
  updateProgress();
}

function updateProgress() {
  const total = batch.items.length;
  const done = Object.keys(selections).length;
  document.getElementById('progress').textContent =
    (idx + 1) + ' / ' + total + '  ·  labeled ' + done;
  const unl = document.getElementById('unlabeled');
  const remaining = total - done;
  unl.textContent = remaining ? '  ·  ' + remaining + ' UNLABELED (press u)' : '  ·  batch complete ✓';
  unl.style.color = remaining ? '#c33' : '#2a7';
  unl.style.fontWeight = remaining ? 'bold' : 'normal';
}

function prev() { if (idx > 0) show(idx - 1); }
function next() { if (idx + 1 < batch.items.length) show(idx + 1); }

function nextUnlabeled() {
  // wrap-around scan for the nearest article with no recorded selection
  const n = batch.items.length;
  for (let k = 1; k <= n; k++) {
    const j = (idx + k) % n;
    if (!selections[batch.items[j].article_id]) { show(j); return; }
  }
}

async function label(action) {
  const it = batch.items[idx];
  // extremes (strong/noise) invite a reason first (D13); Enter/again submits.
  const box = document.getElementById('reason');
  if ((action === 'strong' || action === 'noise') &&
      box.style.display === 'none' && pendingAction !== action) {
    pendingAction = action;
    box.style.display = 'block';
    box.focus();
    return;
  }
  const resp = await fetch('/event', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({article_id: it.article_id, action: action,
                          reason_text: box.value || null})});
  if (resp.ok) {
    selections[it.article_id] = action;
    pendingAction = null;
    next();
  } else {
    document.getElementById('saved').textContent = 'SAVE FAILED — ' + resp.status;
  }
}

document.querySelectorAll('button[data-action]').forEach(b =>
  b.addEventListener('click', () => label(b.dataset.action)));
document.getElementById('prev').addEventListener('click', prev);
document.getElementById('next').addEventListener('click', next);
document.getElementById('next-unlabeled').addEventListener('click', nextUnlabeled);
document.getElementById('reason').addEventListener('keydown', e => {
  const keys = {'1': 'strong', '2': 'interesting', '3': 'weak', '4': 'noise'};
  if (pendingAction && keys[e.key] === pendingAction) {
    e.preventDefault();  // pressing the same action key again submits (documented flow)
    label(pendingAction);
  } else if (e.key === 'Enter' && !e.shiftKey && pendingAction) {
    e.preventDefault();  // plain Enter submits; Shift+Enter = newline
    label(pendingAction);
  } else if (e.key === 'Escape') {
    pendingAction = null;
    e.target.style.display = 'none';
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  const keys = {'1': 'strong', '2': 'interesting', '3': 'weak', '4': 'noise'};
  if (keys[e.key]) label(keys[e.key]);
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'u') nextUnlabeled();
});
init();
</script>
</body>
</html>
